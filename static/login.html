<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖店 ERP 登录</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div class="login-bg">
    <div class="decor-circle decor-1"></div>
    <div class="decor-circle decor-2"></div>
    <div class="login-card" id="login-card">
        <div class="brand">
            <img class="brand-logo" src="/static/img/logo.png" alt="logo">
            <h1>抖店 管理系统</h1>
            <p>Enterprise Resource Planning</p>
        </div>
        <form id="login-form" novalidate>
            <div class="form-item">
                <label for="username">账号</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="请输入账号" autocomplete="username" maxlength="50" required>
                </div>
                <span class="error-msg" id="username-error"></span>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" maxlength="128" required>
                    <button type="button" class="toggle-pwd" id="toggle-pwd" title="显示/隐藏密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <span class="error-msg" id="password-error"></span>
            </div>
            <div class="form-extra">
                <label class="remember">
                    <input type="checkbox" id="remember"> 记住账号
                </label>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">登 录</button>
        </form>
    </div>
</div>
<div class="toast hidden" id="toast"></div>
<script src="/static/js/login.js"></script>
</body>
</html>
